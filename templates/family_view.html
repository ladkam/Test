<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Translator - Recipe Manager</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .translator-page {
            max-width: 900px;
            margin: 0 auto;
        }

        .translator-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border-color);
        }

        .translator-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .translator-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .feature-tags {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .feature-tag {
            background: var(--primary-color);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .translator-form {
            background: var(--card-background);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 1rem;
            align-items: end;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background: var(--background);
            color: var(--text-primary);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .translate-btn {
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .translate-btn:hover {
            background: var(--primary-hover);
        }

        .translate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .form-note {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .loading-state {
            text-align: center;
            padding: 3rem;
            display: none;
        }

        .loading-state .spinner {
            margin: 0 auto 1rem;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c00;
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            display: none;
        }

        .recipe-result {
            background: var(--card-background);
            border-radius: var(--border-radius);
            overflow: hidden;
            display: none;
        }

        .recipe-actions {
            display: flex;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            background: var(--background);
            border-bottom: 1px solid var(--border-color);
        }

        .recipe-actions button {
            padding: 0.6rem 1.25rem;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy {
            background: var(--primary-color);
            color: white;
        }

        .btn-copy:hover {
            background: var(--primary-hover);
        }

        .btn-print {
            background: var(--text-secondary);
            color: white;
        }

        .btn-print:hover {
            background: var(--text-primary);
        }

        .recipe-image {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
        }

        .recipe-content {
            padding: 1.5rem;
        }

        .recipe-title {
            font-size: 1.75rem;
            color: var(--primary-color);
            margin: 0 0 1rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .recipe-meta {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
        }

        .recipe-meta span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 1.5rem 0 1rem;
            color: var(--text-primary);
        }

        .ingredients-list {
            list-style: none;
            padding: 0;
            margin: 0 0 1.5rem;
        }

        .ingredients-list li {
            padding: 0.75rem 0 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            line-height: 1.6;
        }

        .ingredients-list li:last-child {
            border-bottom: none;
        }

        .ingredients-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary-color);
            font-size: 1.25rem;
            line-height: 1;
            top: 0.75rem;
        }

        .instructions-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .instructions-list li {
            padding: 1rem 0 1rem 2.5rem;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            line-height: 1.7;
        }

        .instructions-list li:last-child {
            border-bottom: none;
        }

        .step-num {
            position: absolute;
            left: 0;
            top: 1rem;
            width: 1.75rem;
            height: 1.75rem;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
        }

        @media print {
            .sidebar, .translator-header, .translator-form, .recipe-actions {
                display: none !important;
            }
            .recipe-result {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    {% include '_sidebar.html' %}

    <div class="container">
        <div class="translator-page">
            <div class="translator-header">
                <h1>Recipe Translator</h1>
                <p>Translate NYT Cooking recipes to your language with metric measurements</p>
                <div class="feature-tags">
                    <span class="feature-tag">NYT Cooking</span>
                    <span class="feature-tag">Auto Translation</span>
                    <span class="feature-tag">Metric Units</span>
                </div>
            </div>

            <div class="translator-form card">
                <div class="error-message" id="errorMessage"></div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="recipeUrl">NYT Recipe URL</label>
                        <input type="url" id="recipeUrl" placeholder="https://cooking.nytimes.com/recipes/...">
                    </div>
                    <div class="form-group">
                        <label for="targetLanguage">Translate To</label>
                        <select id="targetLanguage">
                            <option value="es" {% if language == 'es' %}selected{% endif %}>Spanish</option>
                            <option value="fr" {% if language == 'fr' %}selected{% endif %}>French</option>
                            <option value="de" {% if language == 'de' %}selected{% endif %}>German</option>
                            <option value="it" {% if language == 'it' %}selected{% endif %}>Italian</option>
                            <option value="pt" {% if language == 'pt' %}selected{% endif %}>Portuguese</option>
                            <option value="nl" {% if language == 'nl' %}selected{% endif %}>Dutch</option>
                            <option value="ja" {% if language == 'ja' %}selected{% endif %}>Japanese</option>
                            <option value="zh" {% if language == 'zh' %}selected{% endif %}>Chinese</option>
                            <option value="ko" {% if language == 'ko' %}selected{% endif %}>Korean</option>
                        </select>
                    </div>
                    <button id="translateBtn" class="translate-btn" onclick="translateRecipe()">
                        Translate
                    </button>
                </div>

                <p class="form-note">Measurements are automatically converted to metric (ml, g, °C)</p>
            </div>

            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <p>Translating recipe...</p>
            </div>

            <div class="recipe-result" id="recipeResult">
                <div class="recipe-actions">
                    <button class="btn-copy" onclick="copyRecipe()">Copy to Clipboard</button>
                    <button class="btn-print" onclick="window.print()">Print</button>
                </div>

                <img id="recipeImage" class="recipe-image" alt="Recipe" style="display: none;">

                <div class="recipe-content">
                    <h2 class="recipe-title" id="recipeTitle"></h2>
                    <div class="recipe-meta" id="recipeMeta"></div>

                    <h3 class="section-title">Ingredients</h3>
                    <ul class="ingredients-list" id="ingredientsList"></ul>

                    <h3 class="section-title">Instructions</h3>
                    <ol class="instructions-list" id="instructionsList"></ol>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentRecipe = null;

        // Enter key to translate
        document.getElementById('recipeUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') translateRecipe();
        });

        async function translateRecipe() {
            const url = document.getElementById('recipeUrl').value.trim();
            const language = document.getElementById('targetLanguage').value;
            const errorEl = document.getElementById('errorMessage');
            const loadingEl = document.getElementById('loadingState');
            const resultEl = document.getElementById('recipeResult');
            const btn = document.getElementById('translateBtn');

            // Validate
            if (!url) {
                showError('Please enter a recipe URL');
                return;
            }

            if (!url.includes('nytimes.com')) {
                showError('Please enter a valid NYT Cooking URL');
                return;
            }

            // Reset UI
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';
            loadingEl.style.display = 'block';
            btn.disabled = true;
            btn.textContent = 'Translating...';

            try {
                const response = await fetch('/api/family/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, language })
                });

                const data = await response.json();

                if (data.success) {
                    currentRecipe = data.recipe;
                    displayRecipe(data.recipe);
                } else {
                    showError(data.message || 'Translation failed');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Connection error. Please try again.');
            } finally {
                loadingEl.style.display = 'none';
                btn.disabled = false;
                btn.textContent = 'Translate';
            }
        }

        function displayRecipe(recipe) {
            // Image
            const imgEl = document.getElementById('recipeImage');
            if (recipe.image_url) {
                imgEl.src = recipe.image_url;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }

            // Title
            document.getElementById('recipeTitle').textContent = recipe.translated_title;

            // Meta
            const meta = [];
            if (recipe.total_time) meta.push(`<span><strong>Time:</strong> ${recipe.total_time}</span>`);
            if (recipe.servings) meta.push(`<span><strong>Servings:</strong> ${recipe.servings}</span>`);
            if (recipe.author) meta.push(`<span><strong>By:</strong> ${escapeHtml(recipe.author)}</span>`);
            document.getElementById('recipeMeta').innerHTML = meta.join('');

            // Ingredients
            document.getElementById('ingredientsList').innerHTML =
                recipe.translated_ingredients.map(i => `<li>${escapeHtml(i)}</li>`).join('');

            // Instructions with numbered steps
            document.getElementById('instructionsList').innerHTML =
                recipe.translated_instructions.map((inst, idx) =>
                    `<li><span class="step-num">${idx + 1}</span>${escapeHtml(inst)}</li>`
                ).join('');

            // Show result
            document.getElementById('recipeResult').style.display = 'block';
            document.getElementById('recipeResult').scrollIntoView({ behavior: 'smooth' });
        }

        function copyRecipe() {
            if (!currentRecipe) return;

            let text = `${currentRecipe.translated_title}\n\n`;

            if (currentRecipe.total_time) text += `Time: ${currentRecipe.total_time}\n`;
            if (currentRecipe.servings) text += `Servings: ${currentRecipe.servings}\n`;
            text += '\n';

            text += 'INGREDIENTS:\n';
            currentRecipe.translated_ingredients.forEach(i => text += `• ${i}\n`);
            text += '\n';

            text += 'INSTRUCTIONS:\n';
            currentRecipe.translated_instructions.forEach((i, idx) => text += `${idx + 1}. ${i}\n`);

            navigator.clipboard.writeText(text)
                .then(() => alert('Recipe copied to clipboard!'))
                .catch(() => alert('Failed to copy recipe'));
        }

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
