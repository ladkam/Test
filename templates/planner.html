<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Planner - Recipe Management</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include '_sidebar.html' %}

    <div class="container">
        <header class="planner-header">
            <div>
                <h1>This Week's Meals</h1>
                <p class="subtitle">Plan your meals and generate shopping lists</p>
            </div>
            <div class="planner-actions">
                <button id="generateShoppingList" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                    Shopping List
                </button>
                <button id="clearPlan" class="btn btn-secondary">Clear All</button>
            </div>
        </header>

        <!-- Current Plan -->
        <div class="card">
            <div class="plan-header">
                <h2>Your Meal Plan</h2>
                <span id="recipeCount" class="recipe-count">0 recipes</span>
            </div>

            <div id="planList" class="plan-list-simple">
                <div class="empty-plan">
                    <p>No recipes in your plan yet</p>
                    <p class="text-muted">Add recipes from your library below</p>
                </div>
            </div>
        </div>

        <!-- Add Recipes -->
        <div class="card">
            <h2>Add from Library</h2>
            <div class="search-box" style="margin: 1rem 0;">
                <input type="text" id="searchRecipes" placeholder="Search recipes..." class="input-full">
            </div>
            <div id="availableRecipes" class="available-recipes-grid">
                <div class="loading">Loading recipes...</div>
            </div>
        </div>
    </div>

    <!-- Recipe Detail Modal -->
    <div id="recipeModal" class="modal" style="display: none;">
        <div class="modal-content modal-large">
            <button class="close" onclick="closeRecipeModal()">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Servings Modal -->
    <div id="servingsModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 360px;">
            <button class="close" onclick="closeServingsModal()">&times;</button>
            <h2>Select Servings</h2>
            <p id="servingsRecipeName" style="color: var(--text-secondary); margin-bottom: 1.5rem;"></p>
            <div class="servings-selector">
                <button onclick="adjustModalServings(-1)" class="servings-btn-large">−</button>
                <input type="number" id="servingsInput" min="1" value="2" class="servings-input">
                <button onclick="adjustModalServings(1)" class="servings-btn-large">+</button>
            </div>
            <div class="modal-actions" style="margin-top: 1.5rem;">
                <button onclick="closeServingsModal()" class="btn btn-secondary">Cancel</button>
                <button onclick="confirmServings()" class="btn btn-primary">Add to Plan</button>
            </div>
        </div>
    </div>

    <!-- Shopping List Modal -->
    <div id="shoppingListModal" class="modal" style="display: none;">
        <div class="modal-content modal-large">
            <button class="close" onclick="closeShoppingListModal()">&times;</button>
            <div class="shopping-list-content">
                <h2>Shopping List</h2>
                <div id="shoppingListContent"></div>
                <div class="modal-actions">
                    <button onclick="printShoppingList()" class="btn btn-secondary">Print</button>
                    <button onclick="copyShoppingList()" class="btn btn-primary">Copy to Clipboard</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/rating.js') }}"></script>
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/planner.js') }}"></script>
</body>
</html>
