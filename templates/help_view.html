<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Recipes</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Help View Specific Styles - Large, Clean, Simple */
        body {
            font-size: 1.125rem;
            background: var(--background);
        }

        .help-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .help-header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 3px solid var(--primary-color);
        }

        .help-header h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .help-header p {
            font-size: 1.25rem;
            color: var(--text-secondary);
        }

        .header-controls {
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .language-selector label {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .language-selector select {
            font-size: 1rem;
            padding: 0.5rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background: var(--background);
            color: var(--text-primary);
            cursor: pointer;
        }

        .unit-toggle-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background: var(--background);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .unit-toggle-btn:hover {
            border-color: var(--primary-color);
            background: var(--sidebar-hover);
        }

        .recipe-card-simple {
            margin-bottom: 3rem;
            padding: 0;
            background: var(--card-background);
            border-radius: var(--border-radius);
            break-inside: avoid;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .recipe-card-simple.collapsible {
            cursor: default;
        }

        .recipe-header-collapsible {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background: var(--background);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        .recipe-header-collapsible:hover {
            background: var(--sidebar-hover);
        }

        .recipe-header-collapsible h2 {
            font-size: 1.75rem;
            color: var(--primary-color);
            margin: 0;
            border: none;
            padding: 0;
        }

        .recipe-collapse-icon {
            transition: transform 0.3s ease;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .recipe-card-simple.collapsed .recipe-collapse-icon {
            transform: rotate(-90deg);
        }

        .recipe-card-content {
            padding: 2rem;
            transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
            max-height: 5000px;
            opacity: 1;
        }

        .recipe-card-simple.collapsed .recipe-card-content {
            max-height: 0;
            padding: 0 2rem;
            opacity: 0;
            overflow: hidden;
        }

        .recipe-image-simple {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
        }

        .recipe-card-simple h2 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .recipe-meta-simple {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            font-size: 1.125rem;
            color: var(--text-secondary);
        }

        .recipe-section {
            margin-bottom: 2rem;
        }

        .recipe-section h3 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .ingredients-simple {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .ingredients-simple li {
            padding: 0.75rem 1rem;
            background: var(--background);
            border-radius: 0.5rem;
            font-size: 1.125rem;
            border: 1px solid var(--border-color);
        }

        .instructions-simple {
            counter-reset: step-counter;
            list-style: none;
            padding: 0;
        }

        .instructions-simple li {
            counter-increment: step-counter;
            padding: 1.5rem 0 1.5rem 3.5rem;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            font-size: 1.125rem;
            line-height: 1.7;
        }

        .instructions-simple li:before {
            content: counter(step-counter);
            position: absolute;
            left: 0;
            top: 1.5rem;
            background: var(--primary-color);
            color: white;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.25rem;
        }

        .empty-help {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-help h2 {
            font-size: 2rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        @media print {
            .help-header {
                border-bottom: 2px solid black;
            }

            .recipe-card-simple {
                page-break-inside: avoid;
                border: 1px solid #ddd;
            }
        }

        @media (max-width: 768px) {
            .help-header h1 {
                font-size: 2rem;
            }

            .recipe-card-simple h2 {
                font-size: 1.5rem;
            }

            .recipe-meta-simple {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    {% include '_sidebar.html' %}

    <div class="help-container">
        <div class="help-header">
            <h1>📖 This Week's Recipes</h1>
            <p id="weekDate"></p>
            <div class="header-controls">
                <div class="language-selector">
                    <label for="languageSelect">🌍 Language:</label>
                    <select id="languageSelect" onchange="changeLanguage()">
                        <option value="en" {% if language == 'en' %}selected{% endif %}>English (Original)</option>
                        <option value="es" {% if language == 'es' %}selected{% endif %}>Spanish 🇪🇸</option>
                        <option value="fr" {% if language == 'fr' %}selected{% endif %}>French 🇫🇷</option>
                        <option value="de" {% if language == 'de' %}selected{% endif %}>German 🇩🇪</option>
                        <option value="it" {% if language == 'it' %}selected{% endif %}>Italian 🇮🇹</option>
                        <option value="pt" {% if language == 'pt' %}selected{% endif %}>Portuguese 🇵🇹</option>
                        <option value="nl" {% if language == 'nl' %}selected{% endif %}>Dutch 🇳🇱</option>
                        <option value="ja" {% if language == 'ja' %}selected{% endif %}>Japanese 🇯🇵</option>
                        <option value="zh" {% if language == 'zh' %}selected{% endif %}>Chinese 🇨🇳</option>
                        <option value="ko" {% if language == 'ko' %}selected{% endif %}>Korean 🇰🇷</option>
                    </select>
                </div>
                <button id="unitToggleBtn" class="unit-toggle-btn" onclick="toggleUnitSystem()">📏 Metric</button>
            </div>
        </div>

        <div id="recipesList"></div>

        <div id="emptyState" class="empty-help" style="display: none;">
            <h2>No recipes planned for this week</h2>
            <p>Please check back later</p>
        </div>
    </div>

    <script>
        // Unit system preference (default to metric)
        let unitSystem = localStorage.getItem('unitSystem') || 'metric';

        // Unit conversion functions
        function convertToMetric(text) {
            let converted = text;

            // Temperature: Fahrenheit to Celsius
            converted = converted.replace(/(\d+)\s*°?\s*F\b/gi, (match, temp) => {
                const celsius = Math.round((parseFloat(temp) - 32) * 5 / 9);
                return `${celsius}°C`;
            });

            // Cups to ml
            converted = converted.replace(/(\d+\.?\d*)\s*cups?\b/gi, (match, amount) => {
                const ml = Math.round(parseFloat(amount) * 240);
                return `${ml}ml`;
            });

            // Tablespoons to ml
            converted = converted.replace(/(\d+\.?\d*)\s*(tbsp|tablespoons?)\b/gi, (match, amount) => {
                const ml = Math.round(parseFloat(amount) * 15);
                return `${ml}ml`;
            });

            // Teaspoons to ml
            converted = converted.replace(/(\d+\.?\d*)\s*(tsp|teaspoons?)\b/gi, (match, amount) => {
                const ml = Math.round(parseFloat(amount) * 5);
                return `${ml}ml`;
            });

            // Fluid ounces to ml
            converted = converted.replace(/(\d+\.?\d*)\s*(fl\.?\s*oz|fluid\s*ounces?)\b/gi, (match, amount) => {
                const ml = Math.round(parseFloat(amount) * 30);
                return `${ml}ml`;
            });

            // Ounces (weight) to grams
            converted = converted.replace(/(\d+\.?\d*)\s*oz\b/gi, (match, amount) => {
                const g = Math.round(parseFloat(amount) * 28);
                return `${g}g`;
            });

            // Pounds to grams/kg
            converted = converted.replace(/(\d+\.?\d*)\s*(lbs?|pounds?)\b/gi, (match, amount) => {
                const g = Math.round(parseFloat(amount) * 454);
                if (g >= 1000) {
                    return `${(g / 1000).toFixed(1)}kg`;
                }
                return `${g}g`;
            });

            // Inches to cm
            converted = converted.replace(/(\d+\.?\d*)\s*(inches?|in\.?)\b/gi, (match, amount) => {
                const cm = Math.round(parseFloat(amount) * 2.54 * 10) / 10;
                return `${cm}cm`;
            });

            // Quarts to liters
            converted = converted.replace(/(\d+\.?\d*)\s*(quarts?|qt\.?)\b/gi, (match, amount) => {
                const l = Math.round(parseFloat(amount) * 0.946 * 10) / 10;
                return `${l}L`;
            });

            // Pints to ml
            converted = converted.replace(/(\d+\.?\d*)\s*(pints?|pt\.?)\b/gi, (match, amount) => {
                const ml = Math.round(parseFloat(amount) * 473);
                return `${ml}ml`;
            });

            // Gallons to liters
            converted = converted.replace(/(\d+\.?\d*)\s*(gallons?|gal\.?)\b/gi, (match, amount) => {
                const l = Math.round(parseFloat(amount) * 3.785 * 10) / 10;
                return `${l}L`;
            });

            return converted;
        }

        function convertToImperial(text) {
            let converted = text;

            // Temperature: Celsius to Fahrenheit
            converted = converted.replace(/(\d+)\s*°?\s*C\b/gi, (match, temp) => {
                const fahrenheit = Math.round(parseFloat(temp) * 9 / 5 + 32);
                return `${fahrenheit}°F`;
            });

            // ml to cups/tbsp/tsp (choose appropriate unit)
            converted = converted.replace(/(\d+\.?\d*)\s*ml\b/gi, (match, amount) => {
                const ml = parseFloat(amount);
                if (ml >= 240) {
                    const cups = Math.round(ml / 240 * 10) / 10;
                    return `${cups} cup${cups !== 1 ? 's' : ''}`;
                } else if (ml >= 15) {
                    const tbsp = Math.round(ml / 15 * 10) / 10;
                    return `${tbsp} tbsp`;
                } else {
                    const tsp = Math.round(ml / 5 * 10) / 10;
                    return `${tsp} tsp`;
                }
            });

            // Liters to quarts
            converted = converted.replace(/(\d+\.?\d*)\s*L\b/g, (match, amount) => {
                const quarts = Math.round(parseFloat(amount) * 1.057 * 10) / 10;
                return `${quarts} qt`;
            });

            // kg to pounds
            converted = converted.replace(/(\d+\.?\d*)\s*kg\b/gi, (match, amount) => {
                const lbs = Math.round(parseFloat(amount) * 2.205 * 10) / 10;
                return `${lbs} lbs`;
            });

            // grams to ounces
            converted = converted.replace(/(\d+\.?\d*)\s*g\b/gi, (match, amount) => {
                const oz = Math.round(parseFloat(amount) / 28 * 10) / 10;
                return `${oz} oz`;
            });

            // cm to inches
            converted = converted.replace(/(\d+\.?\d*)\s*cm\b/gi, (match, amount) => {
                const inches = Math.round(parseFloat(amount) / 2.54 * 10) / 10;
                return `${inches} in`;
            });

            return converted;
        }

        function convertUnits(text) {
            if (unitSystem === 'metric') {
                return convertToMetric(text);
            } else {
                return convertToImperial(text);
            }
        }

        function toggleUnitSystem() {
            unitSystem = unitSystem === 'metric' ? 'imperial' : 'metric';
            localStorage.setItem('unitSystem', unitSystem);
            updateUnitToggleButton();
            if (cachedRecipes) {
                displayRecipes(cachedRecipes);
            }
        }

        function updateUnitToggleButton() {
            const btn = document.getElementById('unitToggleBtn');
            if (btn) {
                btn.textContent = unitSystem === 'metric' ? '📏 Metric' : '📐 Imperial';
            }
        }

        // Initialize button state
        document.addEventListener('DOMContentLoaded', updateUnitToggleButton);

        // Get week date range
        function getWeekDateRange() {
            const today = new Date();
            const monday = new Date(today);
            monday.setDate(today.getDate() - today.getDay() + 1);

            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            const options = { month: 'long', day: 'numeric', year: 'numeric' };
            return `${monday.toLocaleDateString(undefined, options)} - ${sunday.toLocaleDateString(undefined, options)}`;
        }

        document.getElementById('weekDate').textContent = getWeekDateRange();

        // Load recipes
        async function loadRecipes() {
            try {
                const response = await fetch('/api/planner/current');
                const data = await response.json();

                if (data.success && data.recipes && data.recipes.length > 0) {
                    cachedRecipes = data.recipes;
                    displayRecipes(data.recipes);
                } else {
                    document.getElementById('emptyState').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading recipes:', error);
                document.getElementById('emptyState').style.display = 'block';
            }
        }

        let currentLanguage = '{{ language }}' || 'en';
        let cachedRecipes = null;

        function changeLanguage() {
            currentLanguage = document.getElementById('languageSelect').value;
            if (cachedRecipes) {
                displayRecipes(cachedRecipes);
            }
        }

        function getTranslatedIngredients(recipe) {
            // If English is selected, use original ingredients
            if (currentLanguage === 'en') {
                return recipe.ingredients || [];
            }

            // Try to get translation for selected language
            if (!recipe.translations || Object.keys(recipe.translations).length === 0) {
                return recipe.ingredients || [];
            }

            const translation = recipe.translations[currentLanguage];
            if (translation && translation.ingredients) {
                return translation.ingredients;
            }

            // Fallback to original if translation not available
            return recipe.ingredients || [];
        }

        function getTranslatedInstructions(recipe) {
            // If English is selected, use original instructions
            if (currentLanguage === 'en') {
                return recipe.instructions || [];
            }

            // Try to get translation for selected language
            if (!recipe.translations || Object.keys(recipe.translations).length === 0) {
                return recipe.instructions || [];
            }

            const translation = recipe.translations[currentLanguage];
            if (translation && translation.instructions) {
                return translation.instructions;
            }

            // Fallback to original if translation not available
            return recipe.instructions || [];
        }

        function displayRecipes(recipes) {
            const container = document.getElementById('recipesList');
            const isCollapsible = recipes.length > 1;

            container.innerHTML = recipes.map((recipe, index) => {
                const ingredients = getTranslatedIngredients(recipe);
                const instructions = getTranslatedInstructions(recipe);

                if (isCollapsible) {
                    return `
                        <div class="recipe-card-simple collapsible" data-recipe-index="${index}">
                            <div class="recipe-header-collapsible" onclick="toggleRecipeCard(${index})">
                                <h2>${escapeHtml(recipe.title)}</h2>
                                <svg class="recipe-collapse-icon" width="24" height="24" viewBox="0 0 20 20" fill="none">
                                    <path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                            <div class="recipe-card-content">
                                ${recipe.image_url ? `<img src="${escapeHtml(recipe.image_url)}" alt="${escapeHtml(recipe.title)}" class="recipe-image-simple">` : ''}

                                <div class="recipe-meta-simple">
                                    ${recipe.total_time ? `<span>⏱️ ${formatTime(recipe.total_time)}</span>` : ''}
                                    ${recipe.servings ? `<span>🍽️ ${escapeHtml(recipe.servings)}</span>` : ''}
                                </div>

                                ${ingredients.length > 0 ? `
                                    <div class="recipe-section">
                                        <h3>Ingredients</h3>
                                        <ul class="ingredients-simple">
                                            ${ingredients.map(ing => `<li>${escapeHtml(convertUnits(ing))}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}

                                ${instructions.length > 0 ? `
                                    <div class="recipe-section">
                                        <h3>Instructions</h3>
                                        <ol class="instructions-simple">
                                            ${instructions.map(inst => `<li>${escapeHtml(convertUnits(inst))}</li>`).join('')}
                                        </ol>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="recipe-card-simple">
                            <div class="recipe-card-content">
                                <h2 style="margin-top: 0;">${escapeHtml(recipe.title)}</h2>
                                ${recipe.image_url ? `<img src="${escapeHtml(recipe.image_url)}" alt="${escapeHtml(recipe.title)}" class="recipe-image-simple">` : ''}

                                <div class="recipe-meta-simple">
                                    ${recipe.total_time ? `<span>⏱️ ${formatTime(recipe.total_time)}</span>` : ''}
                                    ${recipe.servings ? `<span>🍽️ ${escapeHtml(recipe.servings)}</span>` : ''}
                                </div>

                                ${ingredients.length > 0 ? `
                                    <div class="recipe-section">
                                        <h3>Ingredients</h3>
                                        <ul class="ingredients-simple">
                                            ${ingredients.map(ing => `<li>${escapeHtml(convertUnits(ing))}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}

                                ${instructions.length > 0 ? `
                                    <div class="recipe-section">
                                        <h3>Instructions</h3>
                                        <ol class="instructions-simple">
                                            ${instructions.map(inst => `<li>${escapeHtml(convertUnits(inst))}</li>`).join('')}
                                        </ol>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        function toggleRecipeCard(index) {
            const card = document.querySelector(`[data-recipe-index="${index}"]`);
            if (card) {
                card.classList.toggle('collapsed');
            }
        }

        function formatTime(minutes) {
            if (!minutes) return '';
            if (minutes < 60) return `${minutes} minutes`;
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return mins > 0 ? `${hours} hour${hours > 1 ? 's' : ''} ${mins} minutes` : `${hours} hour${hours > 1 ? 's' : ''}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load on page load
        loadRecipes();
    </script>
</body>
</html>
